{% extends "base.html" %}
{% block content %}
<div class="container py-3">
  <h4 class="text-light mb-3">Чат із {{ other_user.username }}</h4>

  <div class="chat-window bg-dark p-3 rounded mb-3" style="height: 60vh; overflow-y: auto;">
    {% for m in messages %}
      <div class="mb-2 {% if m.sender == request.user %}text-end{% endif %}">
        <div class="p-2 rounded {% if m.sender == request.user %}bg-primary text-white{% else %}bg-secondary text-light{% endif %}">
          {{ m.text }}
          <br>
          <small class="text-muted">{{ m.timestamp|date:"H:i" }}</small>
        </div>
      </div>
    {% endfor %}
  </div>

  <form method="post" class="d-flex">
    {% csrf_token %}
    <input type="text" name="text" class="form-control me-2" placeholder="Напишіть повідомлення...">
    <button class="btn btn-primary">Надіслати</button>
  </form>
</div>
{% endblock %}
