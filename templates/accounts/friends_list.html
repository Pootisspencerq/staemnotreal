{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>👥 Мої друзі</h2>
  {% if friends %}
    <ul class="list-group mt-3">
      {% for friend in friends %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <a href="{% url 'accounts:profile' friend.user.username %}">
            {{ friend.user.username }}
          </a>
          <a href="{% url 'accounts:remove_friend' friend.user.id %}" class="btn btn-sm btn-outline-danger">
            Видалити
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>У вас поки немає друзів.</p>
  {% endif %}
</div>
{% endblock %}
