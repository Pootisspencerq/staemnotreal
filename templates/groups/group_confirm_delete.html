{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Видалення групи</h2>
  <p>Ти впевнений, що хочеш видалити <strong>{{ group.name }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Так, видалити</button>
    <a href="{% url 'groups:detail' group_id=group.id %}" class="btn btn-secondary">Скасувати</a>

  </form>
</div>
{% endblock %}
