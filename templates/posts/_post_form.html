<form id="create-post-form" method="post" enctype="multipart/form-data" class="mb-4 p-3 border rounded bg-dark shadow-sm">
  {% csrf_token %}

  <div class="mb-3">
    <textarea 
      name="text" 
      class="form-control mb-2" 
      rows="3" 
      placeholder="Що у вас нового?"></textarea>
  </div>

  <div class="mb-3">
    <input 
      type="file" 
      name="file" 
      class="form-control mb-2" 
      accept="*/*">
  </div>

  <div class="mb-3">
    <input 
      type="url" 
      name="link" 
      class="form-control mb-2" 
      placeholder="Посилання (необов'язково)">
  </div>

  <div class="d-grid">
    <button type="submit" class="btn btn-primary w-100">
      <i class="bi bi-send-fill"></i> Опублікувати
    </button>
  </div>
</form>

<style>
#create-post-form {
  background-color: #1b1b1b;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px;
}
#create-post-form textarea,
#create-post-form input {
  background-color: #2a2a2a;
  color: #fff;
  border: 1px solid #444;
  border-radius: 8px;
}
#create-post-form textarea::placeholder,
#create-post-form input::placeholder {
  color: #aaa;
}
#create-post-form button {
  font-weight: 600;
  border-radius: 8px;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('create-post-form');
  const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

  form.addEventListener('submit', async e => {
    e.preventDefault();

    const formData = new FormData(form);
    try {
      const res = await fetch("{% url 'posts:create_post' %}", {
        method: 'POST',
        headers: { 'X-CSRFToken': csrftoken },
        body: formData
      });
      const data = await res.json();

      if (data.success) {
        // Вставляємо новий пост на початок стрічки
        const container = document.querySelector('.container'); // або змінити на div де виводяться пости
        const div = document.createElement('div');
        div.innerHTML = data.post_html;
        container.prepend(div.firstElementChild);

        // Скидаємо форму
        form.reset();
      } else {
        alert(data.error || 'Помилка при створенні поста');
      }
    } catch (err) {
      console.error(err);
      alert('Помилка при створенні поста');
    }
  });
});
</script>
