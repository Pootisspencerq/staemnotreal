<form id="create-post-form" method="post" enctype="multipart/form-data"
      class="mb-4 p-3 border rounded bg-dark shadow-sm">
  {% csrf_token %}

  <!-- TEXT -->
  <div class="mb-3">
    <textarea 
      name="text" 
      class="form-control mb-2 text-light bg-dark border-secondary" 
      rows="3" 
      placeholder="Що у вас нового?"></textarea>
  </div>

  <!-- FILE -->
  <div class="mb-3 custom-file-wrapper">
      <label class="custom-file-label" for="file-input">📁 Вибрати файл</label>
      <span id="file-name" class="file-name-text text-muted">Файл не вибрано</span>

      <input type="file" id="file-input" name="file" accept="*/*"
             style="display:none;">
  </div>

  <!-- LINK -->
  <div class="mb-3">
    <input 
      type="url" 
      name="link" 
      class="form-control mb-2 text-light bg-dark border-secondary" 
      placeholder="Посилання (необов'язково)">
  </div>

  <div class="d-flex justify-content-end mt-2">
    <button type="submit" class="btn btn-primary btn-sm">Опублікувати</button>
  </div>
</form>


<script>
document.addEventListener('DOMContentLoaded', () => {

  /* ===================== DOM ELEMENTS ====================== */
  const form = document.getElementById('create-post-form');
  const fileInput = document.getElementById('file-input');
  const fileName = document.getElementById('file-name');
  const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
  const postsContainer = document.getElementById('posts-container'); // FIXED TARGET

  /* ===================== FILE NAME DISPLAY ================== */
  fileInput.addEventListener('change', () => {
    fileName.textContent =
      fileInput.files.length
        ? fileInput.files[0].name
        : "Файл не вибрано";
  });

  /* ===================== SUBMIT FORM ======================== */
  form.addEventListener('submit', async e => {
    e.preventDefault();

    const formData = new FormData(form);

    try {
      const res = await fetch("{% url 'posts:create_post' %}", {
        method: "POST",
        headers: { "X-CSRFToken": csrftoken },
        body: formData
      });

      const data = await res.json();

      if (data.success) {
        const wrapper = document.createElement("div");
        wrapper.innerHTML = data.post_html;

        postsContainer.prepend(wrapper.firstElementChild);
        form.reset();
        fileName.textContent = "Файл не вибрано";

      } else {
        alert(data.error || "Помилка при створенні поста");
      }

    } catch (err) {
      console.error(err);
      alert("Помилка при створенні поста");
    }
  });

});
</script>
